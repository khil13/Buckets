name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /Buckets/
          # These are the publishable/anon Supabase key and its project URL —
          # safe to expose (RLS enforces read-only access) and end up in the
          # built JS bundle regardless of how they're injected, so they're
          # set here directly rather than requiring a repo secret.
          VITE_SUPABASE_URL: https://smtpfhinrmjpxxthqnie.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_T4Ig08k6BOjJwVbAbAEP8Q_PDKzo-ta
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
